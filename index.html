<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Adnan A. Laskar</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://cdn.jsdelivr.net/npm/misans@4.0.0/lib/Normal/MiSans-Normal.min.css" rel="stylesheet">
  <link href="https://cdn.jsdelivr.net/npm/misans@4.0.0/lib/Normal/MiSans-Semibold.min.css" rel="stylesheet">
  <link href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;600;700&display=swap" rel="stylesheet">
  <style>
    :root {
      --bg: #090b0e;
      --card-bg: #11141a;
      --border: #232834;
      --accent: #ff9800;
      --text: #e6edf3;
      --muted: #8b949e;
    }
    *, *::before, *::after {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }
    body {
      background-color: var(--bg);
      color: var(--text);
      font-family: 'MiSans Latin', 'MiSans', sans-serif;
      line-height: 1.6;
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      align-items: center;
      padding: 2.5rem 1rem;
    }
    .container {
      width: 100%;
      max-width: 680px;
      display: flex;
      flex-direction: column;
      gap: 2rem;
    }
    header {
      border: 1px solid var(--border);
      background: var(--card-bg);
      padding: 1.5rem;
    }
    .profile-meta {
      display: flex;
      justify-content: space-between;
      align-items: flex-start;
      margin-bottom: 0.75rem;
    }
    h1 {
      font-size: 1.4rem;
      font-weight: 700;
      letter-spacing: -0.02em;
    }
    .badge {
      font-family: 'JetBrains Mono', monospace;
      font-size: 0.72rem;
      color: var(--accent);
      border: 1px solid var(--border);
      padding: 2px 8px;
    }
    p.intro {
      font-size: 0.88rem;
      color: var(--muted);
    }
    section {
      border: 1px solid var(--border);
      background: var(--card-bg);
      padding: 1.5rem;
      display: flex;
      flex-direction: column;
      gap: 1rem;
    }
    h2 {
      font-family: 'JetBrains Mono', monospace;
      font-size: 0.85rem;
      font-weight: 700;
      color: var(--accent);
      letter-spacing: 0.05em;
    }
    .project-grid {
      display: flex;
      flex-direction: column;
      gap: 0.75rem;
    }
    .project-item {
      border: 1px solid var(--border);
      padding: 0.85rem 1rem;
      background: rgba(255, 255, 255, 0.02);
      text-decoration: none;
      color: inherit;
      display: flex;
      justify-content: space-between;
      align-items: center;
    }
    .project-item:hover {
      border-color: var(--accent);
    }
    .project-name {
      font-size: 0.9rem;
      font-weight: 600;
    }
    .project-desc {
      font-size: 0.75rem;
      color: var(--muted);
    }
    .project-tag {
      font-family: 'JetBrains Mono', monospace;
      font-size: 0.75rem;
      color: var(--muted);
    }
    .links-list {
      display: flex;
      gap: 0.75rem;
      flex-wrap: wrap;
    }
    .links-list a {
      font-family: 'JetBrains Mono', monospace;
      font-size: 0.78rem;
      color: var(--text);
      border: 1px solid var(--border);
      padding: 0.4rem 0.8rem;
      text-decoration: none;
    }
    .links-list a:hover {
      border-color: var(--accent);
      color: var(--accent);
    }
  </style>
</head>
<body>
  <div class="container">
    <header>
      <div class="profile-meta">
        <div>
          <h1>Adnan A. Laskar</h1>
          <p class="intro">High school student & frontend developer based in Delhi.</p>
        </div>
        <span class="badge">STARDANCE // HC</span>
      </div>
    </header>

    <section>
      <h2>PROJECTS</h2>
      <div class="project-grid">
        <a href="https://aethercube.xyz" target="_blank" rel="noopener noreferrer" class="project-item">
          <div>
            <div class="project-name">Aether-OS</div>
            <div class="project-desc">Web desktop environment with custom window manager & storage.</div>
          </div>
          <span class="project-tag">LIVE ↗</span>
        </a>
        <div class="project-item">
          <div>
            <div class="project-name">OpenFlash</div>
            <div class="project-desc">Hackside Down Hackathon top 10 finalist submission.</div>
          </div>
          <span class="project-tag">2026</span>
        </div>
      </div>
    </section>

    <section>
      <h2>CHANNELS</h2>
      <div class="links-list">
        <a href="https://github.com/really4adnan" target="_blank" rel="noopener noreferrer">github</a>
        <a href="mailto:really4adnan@gmail.com">email</a>
      </div>
    </section>
  </div>
  <script type="module" src="/src/main.ts"></script>
</body>
</html>
